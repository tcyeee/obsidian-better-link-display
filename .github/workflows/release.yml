name: Release

on:
  push:
    tags:
      - "*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Build plugin
        run: |
          npm ci
          npm run build

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"

          # actions/checkout leaves a lightweight ref pointing at the commit, which
          # would make %(contents) return the commit message instead of the tag's
          # annotation. Re-fetch the real tag object first.
          git fetch origin "refs/tags/$tag:refs/tags/$tag" --force

          notes="$(git tag -l --format='%(contents)' "$tag")"

          if [ -n "$notes" ]; then
            echo "$notes" > /tmp/release-notes.md
            gh release create "$tag" --title="$tag" --notes-file /tmp/release-notes.md \
              main.js manifest.json styles.css
          else
            gh release create "$tag" --title="$tag" --generate-notes \
              main.js manifest.json styles.css
          fi
